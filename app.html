<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cornell Nutrition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
/* Layout: one narrow column, one step at a time: places, then a menu, then one item. */
:root {
  --bg: #f3f2f2;
  --card: #ffffff;
  --ink: #1a1414;
  --muted: #6b6262;
  --line: #e2dddd;
  --accent: #b31b1b;
  --on-accent: #ffffff;
  --leaf: #12805c;
  --warn: #a16207;
  --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121010; --card: #1d1a1a; --ink: #f2eded; --muted: #a39999; --line: #302a2a;
    --accent: #ff6b5e; --on-accent: #1a0a0a; --leaf: #4fd1a1; --warn: #f2b84b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121010; --card: #1d1a1a; --ink: #f2eded; --muted: #a39999; --line: #302a2a;
  --accent: #ff6b5e; --on-accent: #1a0a0a; --leaf: #4fd1a1; --warn: #f2b84b; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.topbar { height: 6px; background: var(--accent); }
/* Wide screens: live "open now" + dining halls on the left, food events on the right. */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); }
.rail { display: none; }
@media (min-width: 1180px) {
  .shell { grid-template-columns: minmax(240px, 1fr) minmax(0, 680px) minmax(260px, 1fr); gap: 36px; padding-inline: 28px; }
  .rail { display: block; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; scrollbar-width: none; padding-block: 30px 40px; width: 100%; max-width: 300px; }
  .rail::-webkit-scrollbar { display: none; }
  .rail-l { justify-self: end; animation: in-back .6s var(--ease) both .15s; }
  .rail-r { justify-self: start; animation: in-fwd .6s var(--ease) both .25s; }
}
.rail h4 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.rail h4 + .rnote { margin-top: -6px; }
.rail section + section { margin-top: 30px; }
.rnote { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.4; }
.openrow { display: flex; align-items: center; gap: 10px; width: calc(100% + 20px); text-align: left; padding: 8px 10px; margin: 0 -10px; border-radius: 10px; font-size: 14.5px; transition: background .2s; }
.openrow:hover { background: var(--card); }
.openrow .dot { width: 8px; height: 8px; border-radius: 99px; background: #9a9090; flex: none; }
.openrow .dot.on { background: #16a34a; animation: pulse 2s infinite; }
.openrow b { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.openrow small { color: var(--muted); white-space: nowrap; font-size: 12.5px; }
.hall { padding: 12px 0; border-top: 1px solid var(--line); }
.hall:first-of-type { border-top: 0; padding-top: 2px; }
.hall b { display: block; font-size: 14.5px; font-weight: 700; }
.hall .when { font-size: 12.5px; color: var(--muted); }
.hall .when .now { color: #16a34a; font-weight: 600; }
.hall ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.hall li { font-size: 13.5px; line-height: 1.35; padding-left: 12px; position: relative; }
.hall li::before { content: ""; position: absolute; left: 0; top: .55em; width: 5px; height: 5px; border-radius: 99px; background: var(--accent); }
.ev { display: block; text-decoration: none; color: inherit; border-radius: 16px; overflow: hidden; background: var(--card); box-shadow: 0 0 0 1px var(--line); transition: transform .3s var(--ease), box-shadow .3s; }
.ev + .ev { margin-top: 12px; }
.ev:hover { transform: translateY(-3px); box-shadow: 0 0 0 1.5px var(--accent), 0 14px 26px -16px var(--accent); }
.ev .pic { position: relative; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: var(--line); }
.ev .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
.ev:hover .pic img { transform: scale(1.06); }
.ev .date { position: absolute; left: 10px; top: 10px; background: #fff; color: #1a1414; border-radius: 10px; padding: 4px 8px 5px; text-align: center; line-height: 1; box-shadow: 0 2px 8px rgb(0 0 0 / 18%); }
.ev .date small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #b31b1b; }
.ev .date b { font-size: 20px; font-weight: 800; }
.ev .txt { padding: 10px 12px 12px; }
.ev .txt b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.ev .txt small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.ev-strip { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 34px; padding: 2px 16px 6px; scroll-snap-type: x mandatory; }
.ev-strip::-webkit-scrollbar { display: none; }
.ev-strip .ev { flex: 0 0 240px; scroll-snap-align: start; }
.ev-strip .ev + .ev { margin-top: 0; }
@media (min-width: 1180px) { .ev-strip, .ev-label { display: none; } }
.app { min-width: 0; width: 100%; max-width: 680px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.mark { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.mark span { color: var(--accent); }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px; }
.search { position: relative; display: block; margin-bottom: 28px; }
.search input { width: 100%; border: 0; border-radius: 16px; background: var(--card); padding: 16px 18px 16px 48px; font-size: 17px; box-shadow: 0 0 0 1px var(--line); transition: box-shadow .2s; }
.search input:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
.search svg { position: absolute; left: 18px; top: 50%; translate: 0 -50%; color: var(--muted); }

/* Views slide in from the side they logically come from. */
.view { animation: in-fwd .38s var(--ease) both; }
.view.back { animation-name: in-back; }
@keyframes in-fwd { from { opacity: 0; transform: translateX(28px); } }
@keyframes in-back { from { opacity: 0; transform: translateX(-28px); } }
.stagger > * { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; margin: 0 0 6px; }
h1 { font-size: clamp(34px, 7vw, 52px); line-height: 1; letter-spacing: -0.035em; font-weight: 800; margin: 0; text-wrap: balance; }

/* Places */
.places { list-style: none; margin: 8px 0 0; padding: 0; }
.place { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 14px 2px; border-bottom: 1px solid var(--line); }
.place b { font-size: clamp(22px, 4.6vw, 30px); font-weight: 700; letter-spacing: -0.025em; transition: transform .25s var(--ease), color .2s; }
.place small { color: var(--muted); font-size: 14px; white-space: nowrap; }
.place:hover b { color: var(--accent); transform: translateX(6px); }

.place .what { display: block; font-size: 13.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.place > span { min-width: 0; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 34px; }
.pick { text-align: left; background: var(--card); border-radius: 16px; padding: 14px 14px 12px; box-shadow: 0 0 0 1px var(--line); transition: transform .25s var(--ease), box-shadow .2s; }
.pick:hover { transform: translateY(-3px); box-shadow: 0 0 0 1.5px var(--accent), 0 10px 22px -12px var(--accent); }
.pick b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.pick small { color: var(--muted); font-size: 12.5px; }
.pick i { display: block; font-style: normal; font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 10px; letter-spacing: -0.03em; }
@media (max-width: 560px) { .picks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* "Where should I go?" */
.ask { margin: 0 0 34px; padding: 20px 20px 18px; border-radius: 20px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.ask-q { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
.ask-step { margin-top: 20px; animation: rise .45s var(--ease) both; }
.ask .chip { font-size: 14.5px; padding: 8px 14px; }
.chip.loc { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
.chip.loc.sel { color: var(--on-accent); }
.chip.loc[disabled] { opacity: .5; }
.ask-out:not(:empty) { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.ask-sum { margin: 0 0 14px; font-size: 15.5px; line-height: 1.45; }
.sugg { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.sugg li { display: grid; border-radius: 16px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.sugg li:first-child { box-shadow: 0 0 0 1.5px var(--accent); }
.sg { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; text-align: left; }
.sg .mark { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 1px var(--line); }
.sg .mark img { width: 86%; height: 86%; object-fit: contain; }
.sg .mark.mono { background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 15px; box-shadow: none; }
.sg b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; transition: color .2s; }
.sg small { color: var(--muted); font-size: 13px; }
.sg small .open { color: var(--leaf); font-weight: 600; }
.sg:hover b { color: var(--accent); }
.sg-min { text-align: right; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.sg-min small { display: block; font-size: 11.5px; font-weight: 500; letter-spacing: 0; margin-top: 3px; }
.sg-try { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; text-align: left; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 5%, var(--card)); font-size: 14.5px; transition: background .2s; }
.sg-try:hover { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.sg-try > span:first-child { color: var(--muted); }
.sg-try b { font-weight: 600; min-width: 0; }
.sg-try .kc { margin-left: auto; white-space: nowrap; color: var(--muted); }
.fav { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); white-space: nowrap; }
.fav-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 13.5px; color: var(--muted); }
.fav-line a { color: inherit; }
@media (max-width: 560px) { .ask { padding: 16px 14px; } .ask-q { font-size: 17px; } .sg-try { flex-wrap: wrap; row-gap: 2px; } .sg-try .kc { flex-basis: 100%; margin-left: 0; font-size: 13px; } .sg { gap: 10px; padding: 12px; } }

/* Logo tiles: real logos sit on white (they're drawn for white); the rest get a red monogram. */
.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.tile { display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left; background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); transition: transform .3s var(--ease), box-shadow .3s; }
.tile:hover { transform: translateY(-4px); box-shadow: 0 0 0 1.5px var(--accent), 0 16px 30px -18px var(--accent); }
.tile .art { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; overflow: hidden; }
.tile .art > * { transition: transform .45s var(--ease); }
.tile:hover .art > * { transform: scale(1.06); }
.tile .txt { padding: 12px 14px 14px; display: grid; gap: 2px; border-top: 1px solid var(--line); flex: 1; align-content: start; }
.tile b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.tile small { color: var(--muted); font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.logo { background: #ffffff; }
.logo img { width: 78%; height: 78%; object-fit: contain; }
.mono { background: var(--accent); color: #fff; }
.mono > span:not(.status) { font-size: clamp(38px, 9vw, 56px); font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
.mono.alt { background: var(--ink); color: var(--bg); }
.head-logo { width: 64px; height: 64px; flex: none; border-radius: 14px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); animation: pop-in .5s var(--ease) both .1s; }
.head-logo .mono-s { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; }
@keyframes pop-in { from { transform: scale(.6) rotate(-6deg); opacity: 0; } }
.title-row { display: flex; align-items: center; gap: 14px; min-width: 0; }

.tile .art { position: relative; }
.status { position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px; background: rgb(255 255 255 / 92%); color: #1a1414; box-shadow: 0 1px 3px rgb(0 0 0 / 12%); }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: #9a9090; }
.status.open::before { background: #16a34a; box-shadow: 0 0 0 0 rgb(22 163 74 / 60%); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgb(22 163 74 / 0%); } 100% { box-shadow: 0 0 0 0 rgb(22 163 74 / 0%); } }
.lines { list-style: none; margin: 0; padding: 0; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--muted); }
.meta-line .open { color: #16a34a; font-weight: 600; }
.verify { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line); font-size: 14px; line-height: 1.5; }
.verify .ic { width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; background: #16a34a; color: #fff; }
.verify.caution .ic { background: var(--warn); }
.verify b { font-weight: 600; }
.verify p { margin: 0; }
.verify p + p { margin-top: 6px; color: var(--muted); }
.src-line { margin-top: 10px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.src-line svg { color: #16a34a; flex: none; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 22px -4px 0; padding: 10px 4px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.tab { flex: none; padding: 8px 12px 12px; font-size: 15px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: color .2s; }
.tab small { font-weight: 500; font-size: 12px; margin-left: 5px; opacity: .7; }
.tab[aria-selected="true"] { color: var(--ink); }
.ink { position: absolute; left: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); transition: transform .35s var(--ease), width .35s var(--ease); }
.tab-body { animation: fade .3s var(--ease) both; }
.tab-body.from-right { animation: in-fwd .32s var(--ease) both; }
.tab-body.from-left { animation: in-back .32s var(--ease) both; }
.tab-body > .note { margin: 14px 0 0; }
.vline summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: #16a34a; font-weight: 600; }
.vline summary::-webkit-details-marker { display: none; }
.vline p { flex-basis: 100%; margin: 8px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.vline[open] { flex-basis: 100%; }

.seg2 { position: relative; display: inline-flex; flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 4px; border-radius: 99px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.seg2 button { position: relative; z-index: 1; flex: none; padding: 8px 16px; border-radius: 99px; font-size: 15px; font-weight: 500; white-space: nowrap; transition: color .25s; }
.seg2 button.sel { color: var(--on-accent); }
.seg2 .thumb { position: absolute; z-index: 0; left: 0; top: 4px; bottom: 4px; border-radius: 99px; background: var(--accent); transition: transform .4s var(--ease), width .4s var(--ease); }
.item .kc i { font-style: normal; color: var(--muted); font-weight: 400; margin: 0 1px; }
.item { transition: background .2s; border-radius: 10px; }
.item:active { transform: scale(.985); }
.tile { transform-style: preserve-3d; will-change: transform; }

.mark { display: inline-flex; align-items: center; gap: 8px; }
.spark { width: 22px; height: 22px; color: var(--accent); flex: none; overflow: visible; animation: drift 40s linear infinite; }
.spark line { transform-box: view-box; transform-origin: 20px 20px; }
.spark.thinking line { animation: breathe .9s cubic-bezier(.45, 0, .55, 1) both; animation-delay: calc(var(--r) * 55ms); }
.spark.thinking { animation: drift 40s linear infinite, nudge .9s var(--ease); }
.spark.sm { width: 16px; height: 16px; }
.big .think-spark { position: absolute; right: 0; bottom: 14px; width: 26px; height: 26px; opacity: 0; transition: opacity .3s; }
.big.think .think-spark { opacity: 1; }
@keyframes drift { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 45% { transform: scale(.35); } 70% { transform: scale(1.15); } }
@keyframes nudge { 50% { scale: 1.15; } }
.w { display: inline-block; animation: word-in .55s var(--ease) both; animation-delay: calc(var(--d) * var(--step, 38ms)); }
@keyframes word-in { from { opacity: 0; filter: blur(8px); transform: translateY(.2em); } }
.insight { display: flex; gap: 9px; align-items: flex-start; margin: 16px 0 0; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 7%, var(--card)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 18%, var(--line)); font-size: 15px; line-height: 1.45; }
.insight .spark.sm { margin-top: 3px; }
.big { overflow: visible; }
.big::after { content: ""; position: absolute; inset: -6px -12px; pointer-events: none; opacity: 0; background: linear-gradient(105deg, transparent 30%, color-mix(in srgb, var(--card) 85%, transparent) 50%, transparent 70%); background-size: 250% 100%; }
.big.think::after { animation: shimmer .8s var(--ease); }
@keyframes shimmer { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -60% 0; } }
.lean { display: block; width: calc(100% + 20px); text-align: left; padding: 10px; margin: 0 -10px; border-radius: 12px; transition: background .2s; }
.lean:hover { background: var(--card); }
.lean b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.lean small { display: block; font-size: 12px; color: var(--muted); }
.lean-bar { display: block; height: 4px; border-radius: 99px; background: var(--line); margin: 7px 0 4px; overflow: hidden; }
.lean-bar span { display: block; height: 100%; width: var(--w); border-radius: inherit; background: var(--accent); animation: grow 1s var(--ease) both .3s; transform-origin: left; }
.lean-n { font-size: 12.5px; color: var(--muted); }
.lean-n b { display: inline; color: var(--ink); font-size: 12.5px; }

/* Menu */
.back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; font-weight: 500; margin-bottom: 14px; padding: 4px 0; }
.back-btn:hover { color: var(--ink); }
.back-btn svg { transition: transform .2s var(--ease); }
.back-btn:hover svg { transform: translateX(-3px); }
.menu-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
.filter-btn { flex: none; border-radius: 99px; padding: 8px 14px; font-size: 14px; font-weight: 600; box-shadow: 0 0 0 1px var(--line); background: var(--card); }

    <div id="facts"></div>
    <div id="contains"></div>
    ${it.ingredients ? `<details class="ingr"><summary>Ingredients</summary><p>${esc(it.ingredients)}</p></details>` : ""}`;
}

// Segmented control: buttons plus a thumb that slides to the selected one.
function seg(options, key) {
  return `<div class="seg2" data-seg="${key}">${options.map(([v, l]) => `<button type="button" data-${key}="${esc(v)}">${esc(l)}</button>`).join("")}<span class="thumb"></span></div>`;
}
function moveThumbs() {
  document.querySelectorAll(".seg2").forEach((g) => {
    const on = g.querySelector("button.sel"), t = g.querySelector(".thumb");
    if (!on) { t.style.opacity = 0; return; }
    t.style.opacity = 1; t.style.width = on.offsetWidth + "px"; t.style.transform = `translateX(${on.offsetLeft}px)`;
  });
}
function variantPicker() {
  const g = S.group; if (!g) return "";
  return g.dims.map((d) => {
    const vals = [...new Set(g.variants.map((v) => v[d]))];
    return `<div class="block"><h3>${DIMS[d].label}</h3>${seg(vals.map((x) => [x, x]), "v-" + d)}</div>`;
  }).join("");
}
function pickVariant(dim, val) {
  const g = S.group, cur = g.variants.find((v) => v.it.id === S.item);
  const want = { ...cur, [dim]: val };
  const next = g.variants.find((v) => g.dims.every((d) => v[d] === want[d])) || g.variants.find((v) => v[dim] === val);
  if (!next || next.it.id === S.item) return;
  // Swap the item underneath but keep the screen, so the number rolls instead of the page sliding.
  S.item = next.it.id; S.removed = new Set(); S.extras = new Set();
  const keep = lastCal, y = scrollY;
  $("#view").innerHTML = itemHTML();
  roll($("#roll"), keep); void $("#roll").offsetWidth;
  update(); scrollTo(0, y); watchMini();
}

function sourceLine(it, home) {
  const fav = it.fav ? `<p class="fav-line"><span class="fav">Fan favorite</span><a href="${esc(it.fav.url)}" target="_blank" rel="noopener">${esc(it.fav.why)}</a></p>` : "";
  if (it.source === "dairy") return `<div class="src-line">${CHECK}From Cornell Dairy's nutrition label · ${esc(it.servingSize)}</div>${fav}
    ${it.seasonal ? `<p class="est">Seasonal flavor, so it may not be in the case today.</p>` : ""}
    ${it.labelNote ? `<p class="est">${esc(it.labelNote)}</p>` : ""}`;
  if (!it.typical) return `<div class="src-line">${CHECK}On Cornell's NetNutrition list for ${esc(home?.eatery.live?.name || home?.eatery.name)} · ${esc(it.servingSize || it.serving)}</div>${fav}`;
  const w = it.where || [];
  const shown = w.slice(0, 4).join(", ") + (w.length > 4 ? ` and ${w.length - 4} more` : "");
  return `<div class="src-line">${CHECK}Sold at ${esc(shown)}</div>
    ${it.whereNote ? `<p class="est">${esc(it.whereNote)}</p>` : it.whereExact ? "" : `<p class="est">These cafés have a coffee bar on Cornell's list. Cornell doesn't publish each bar's drink menu, so ask if they make this one.</p>`}`;
}

/* ---------- Item math ---------- */
function nutrition(it) {
  const out = {};
  if (it.drink) {
    const d = it.drink, f = S.size / 16;
    for (const k of KEYS) out[k] = (d.base[k] + (DRINK.milks[S.milk][k] * d.milkOz) / 8) * f + S.pumps * DRINK.syrup[k] + (S.whip ? DRINK.whip[k] : 0);
    return out;
  }
  for (const k of KEYS) {
    let v = it[k] ?? 0;
    for (const p of it.parts) if (S.removed.has(p.label)) v -= p.n[k] || 0;
    for (const x of S.extras) v += ITEMS[x][k] || 0;
    out[k] = Math.max(0, v) * S.servings;
  }
  return out;
}
function allergens(it) {
  if (!it.drink) return it.allergens || [];
  const a = new Set(it.drink.allergens); const m = DRINK.milkAllergen[S.milk]; if (m) a.add(m); if (S.whip) a.add("Milk");
  return [...a].sort();
}

/* ---------- Live updates on the item screen ---------- */
// Count a number from what it shows now to its new value.
function tween(el, to, suffix = "", ms = 450) {
  const from = parseFloat(el.textContent) || 0;
  if (from === to) { el.textContent = to + suffix; return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - (1 - k) ** 3; el.textContent = Math.round(from + (to - from) * e) + suffix; if (k < 1 && el.isConnected) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let lastCal = null;
function roll(el, value) {
  const s = String(value);
  if (el.childElementCount !== s.length) {
    el.innerHTML = [...s].map(() => `<span class="col"><span class="strip">${"0123456789".split("").map((d) => `<span>${d}</span>`).join("")}</span></span>`).join("");
    void el.offsetWidth;
  }
  [...s].forEach((d, i) => { el.children[i].firstChild.style.transform = `translateY(${-d}em)`; });
  el.setAttribute("aria-label", `${value} calories`);
}
function update(first) {
  const it = ITEMS[S.item], n = nutrition(it), cal = r0(n.calories);
  const base = {}; for (const k of KEYS) base[k] = it[k] ?? 0;
  if (first) { roll($("#roll"), String(cal).replace(/\d/g, "0")); void $("#roll").offsetWidth; }
  roll($("#roll"), cal);
  if (!first && lastCal != null && cal !== lastCal) {
    const p = document.createElement("span"); p.className = "pop";
    p.textContent = `${cal > lastCal ? "+" : "−"}${Math.abs(cal - lastCal)}`;
    $(".big").append(p); setTimeout(() => p.remove(), 1200);
  }
  if (!first && lastCal != null && cal !== lastCal) think();
  lastCal = cal;
  setInsight(insightFor(it, n));
  const pct = Math.round((cal / 2000) * 100);
  requestAnimationFrame(() => { const bar = $("#dayBar"); if (bar) bar.style.width = Math.min(100, pct) + "%"; });
  $("#dayTxt").textContent = `${pct}% of a 2,000-calorie day`;
  $("#miniCal").innerHTML = `${cal}<small>cal</small>`;
  if (!$("#macros").children.length) $("#macros").innerHTML = `<span><b data-m="protein">0g</b>protein</span><span><b data-m="carbs">0g</b>carbs</span><span><b data-m="fat">0g</b>fat</span>`;
  document.querySelectorAll("[data-m]").forEach((b) => tween(b, r0(n[b.dataset.m]), "g"));

  document.querySelectorAll("[data-serv]").forEach((b) => b.classList.toggle("sel", +b.dataset.serv === S.servings));
  if (S.group) { const cur = S.group.variants.find((v) => v.it.id === S.item); for (const d of S.group.dims) document.querySelectorAll(`[data-v-${d}]`).forEach((b) => b.classList.toggle("sel", b.dataset["v-" + d] === cur[d] || b.getAttribute(`data-v-${d}`) === cur[d])); }
  document.querySelectorAll("[data-part]").forEach((b) => { const off = S.removed.has(b.dataset.part); b.classList.toggle("off", off); b.setAttribute("aria-pressed", !off); });
  document.querySelectorAll("[data-add]").forEach((b) => { const on = S.extras.has(+b.dataset.add); b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); });
  document.querySelectorAll("[data-size]").forEach((b) => b.classList.toggle("sel", +b.dataset.size === S.size));
  document.querySelectorAll("[data-milk]").forEach((b) => b.classList.toggle("sel", b.dataset.milk === S.milk));
  document.querySelectorAll("[data-whip]").forEach((b) => b.classList.toggle("sel", (b.dataset.whip === "1") === S.whip));
  requestAnimationFrame(moveThumbs);
  if ($("#pumps")) $("#pumps").textContent = `${S.pumps} pump${S.pumps === 1 ? "" : "s"}`;
  if ($("#est")) $("#est").hidden = !it.parts.some((p) => S.removed.has(p.label) && p.src === "typical");

  // Values that differ from the dish as served turn the accent color.
  const row = (label, k, unit, cls = "") => {
    const dv = DV[k] ? `<b>${r0((n[k] / DV[k]) * 100)}%</b>` : "<span></span>";
    const val = `<span class="${r0(n[k]) !== r0(base[k]) ? "chg" : ""}">${r0(n[k])}${unit}</span>`;
    return `<div class="r ${cls}"><span>${cls.includes("in") ? label : `<b>${label}</b>`} ${val}</span>${dv}</div>`;
  };
  const serving = it.drink ? `${S.size} fl oz` : it.source === "dairy" ? `${sizesFor(it).find(([v]) => v === S.servings)?.[1] ?? ""} scoop, about ${SCOOP_CUPS[S.servings] ?? ""}` : `${SERVINGS.find(([v]) => v === S.servings)?.[1] ?? S.servings} × ${esc(it.servingSize || it.serving)}`;
  $("#facts").innerHTML = `<div class="facts" aria-label="Nutrition Facts">
    <h4>Nutrition Facts</h4>
    <div class="serv"><span>Serving size</span><span>${serving}</span></div>
    <div class="cal"><span>Calories</span><b>${cal}</b></div>
    <div class="dvh">% Daily Value*</div>
    ${row("Total Fat", "fat", "g")}${row("Saturated Fat", "satFat", "g", "in")}${row("Cholesterol", "cholesterol", "mg")}
    ${row("Sodium", "sodium", "mg")}${row("Total Carbohydrate", "carbs", "g")}${row("Dietary Fiber", "fiber", "g", "in")}
    ${row("Total Sugars", "sugars", "g", "in")}${it.addedSugars != null ? `<div class="r in2"><span>Includes ${r0(it.addedSugars * S.servings)}g Added Sugars</span><b>${r0((it.addedSugars * S.servings / 50) * 100)}%</b></div>` : ""}${row("Protein", "protein", "g", "end")}
    <div class="foot">* Percent Daily Values are based on a 2,000 calorie diet.</div></div>`;
  const al = allergens(it);
  $("#contains").innerHTML = al.length ? `<p class="contains">Contains <b>${al.map(esc).join(", ")}</b>${S.removed.size ? `<br><small style="color:var(--muted)">As Cornell makes it. Leaving something off may not remove an allergen.</small>` : ""}</p>` : "";
}

/* ---------- Events ---------- */
$("#view").addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if ("back" in d) return goBack();
  if (d.want || d.at || "locate" in d) return askClick(d, t);
  if (d.place) return go("menu", { eatery: +d.place, tab: 0 });
  if (d.tab) return switchTab(+d.tab);
  if (d.pick) return go("pick", { pick: d.pick });
  if (d.item || d.group) {
    let group = null, id = +d.item;
    if (d.group) {
      const ids = d.group.split(",").map(Number);
      group = groupRows(ids.map((x) => ITEMS[x]))[0].group;
      id = group.variants[0].it.id;
    }
    const it = ITEMS[id];
    lastCal = null;
    return go("item", { item: id, group, from: S.q ? "search" : S.view, servings: startServings(it), removed: new Set(), extras: new Set(), size: 16, milk: it.drink?.milk ?? "None", pumps: 0, whip: false });
  }
  const vk = Object.keys(d).find((k) => k.startsWith("v-") || /^v[A-Z]/.test(k));
  if (vk) { const dim = vk.replace(/^v-?/, "").toLowerCase(); return pickVariant(dim, d[vk]); }
  if ("filters" in d) return openSheet();
  if (d.serv) S.servings = +d.serv;
  else if (d.part) S.removed.has(d.part) ? S.removed.delete(d.part) : S.removed.add(d.part);
  else if (d.add) S.extras.has(+d.add) ? S.extras.delete(+d.add) : S.extras.add(+d.add);
  else if (d.size) S.size = +d.size;
  else if (d.milk) S.milk = d.milk;
  else if (d.pump) S.pumps = Math.min(8, Math.max(0, S.pumps + +d.pump));
  else if (d.whip) S.whip = d.whip === "1";
  else return;
  update();
});

$("#q").addEventListener("input", (ev) => {
  const was = !!S.q;
  S.q = ev.target.value.trim().toLowerCase();
  // Clearing the search returns to wherever you were when you started typing.
  if (!was && S.q) S.base = S.view === "item" ? (S.eatery ? "menu" : "places") : S.view;
  S.view = S.base || "places";
  if (was && S.q) { $("#view").innerHTML = searchHTML(); return; } // no slide on every keystroke
  render(!S.q);
});

/* ---------- Filter sheet ---------- */
const DIETS = ["Vegan", "Vegetarian", "Halal", "Kosher"];
const ALLERGENS = [...new Set(Object.values(ITEMS).flatMap((i) => i.allergens || []))].sort();
function openSheet() {
  $("#sheetRoot").innerHTML = `<div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-label="Filters">
      <h3>Only show</h3><div class="chips">${DIETS.map((x) => `<button class="chip ${S.diets.has(x) ? "sel" : ""}" data-diet="${x}">${x}</button>`).join("")}</div>
      <h3>Hide anything with</h3><div class="chips">${ALLERGENS.map((x) => `<button class="chip avoid ${S.avoid.has(x) ? "sel" : ""}" data-avoid="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <h3>Order by</h3><div class="chips">${[["menu", "Menu"], ["light", "Fewest calories"], ["protein", "Most protein"]].map(([v, l]) => `<button class="chip ${S.sort === v ? "sel" : ""}" data-sort="${v}">${l}</button>`).join("")}</div>
      <button class="done" data-close>Show results</button>
    </div>`;
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; store.set("diets", [...S.diets]); store.set("avoid", [...S.avoid]); render(); }
$("#sheetRoot").addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-close],[data-diet],[data-avoid],[data-sort]"); if (!t) return;
  const d = t.dataset;
  if ("close" in d) return closeSheet();
  if (d.sort) { S.sort = d.sort; t.parentNode.querySelectorAll(".chip").forEach((c) => c.classList.toggle("sel", c === t)); return; }
  const set = d.diet ? S.diets : S.avoid, key = d.diet || d.avoid;
  set.has(key) ? set.delete(key) : set.add(key);
  t.classList.toggle("sel", set.has(key));
});

function arrow() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>`; }

$("#foot").innerHTML = `Unofficial. Food data from Cornell Dining's <a href="https://netnutrition.dining.cornell.edu/NetNutrition/1" target="_blank" rel="noopener">NetNutrition</a>, ${esc(DATA.scrapedAt)}. Tell staff about allergies; cross-contact can happen.`;
/* ---------- Claude-style motion: words that write themselves in, a spark that works while numbers change ---------- */
function streamWords(el, text, step = 38) {
  const words = (text ?? el.textContent).trim().split(/\s+/);
  el.innerHTML = words.map((w, i) => `<span class="w" style="--d:${i}">${esc(w)}</span>`).join(" ");
  el.style.setProperty("--step", step + "ms");
}
// A twelve-ray starburst; rays have uneven lengths so it reads as hand-made, and each ray
// carries its index so the "thinking" breath ripples around it.
const RAYS = [10, 14, 11, 15, 10, 13, 11, 15, 10, 14, 12, 13];
function sparkSVG(cls = "", id = "") {
  const rays = RAYS.map((len, i) => `<g transform="rotate(${i * 30 + (i % 3) * 4} 20 20)"><line style="--r:${i}" x1="20" y1="16.5" x2="20" y2="${16.5 - len}" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></g>`).join("");
  return `<svg class="spark ${cls}" ${id ? `id="${id}"` : ""} viewBox="-2 -2 44 44" aria-hidden="true">${rays}</svg>`;
}
function breathe(el) {
  if (!el) return;
  el.classList.remove("thinking"); void el.getBoundingClientRect(); el.classList.add("thinking");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("thinking"), 1600);
}
function think() {
  breathe($("#spark")); breathe($("#thinkSpark"));
  const big = $(".big"); if (big) { big.classList.add("think"); clearTimeout(big._t); big._t = setTimeout(() => big.classList.remove("think"), 1100); }
}
// One or two plain-language notes about the item as it's currently customized.
function insightFor(it, n) {
  const notes = [], pct = (v, dv) => Math.round((v / dv) * 100);
  const added = (it.addedSugars ?? 0) * S.servings;
  if (n.protein >= 20) notes.push(`${r0(n.protein)}g of protein, about ${pct(n.protein, 50)}% of a day's worth.`);
  else if (n.calories <= 350 && n.protein >= 12) notes.push(`A lighter pick with ${r0(n.protein)}g of protein.`);
  if (n.sodium >= 800) notes.push(`Salty: ${r0(n.sodium)}mg of sodium is ${pct(n.sodium, 2300)}% of a day.`);
  if (added >= 15) notes.push(`${r0(added)}g of added sugar, ${pct(added, 50)}% of the daily limit.`);
  else if (n.satFat >= 10) notes.push(`${r0(n.satFat)}g of saturated fat, ${pct(n.satFat, 20)}% of a day.`);
  if (n.fiber >= 5 && notes.length < 2) notes.push(`Good fiber at ${r0(n.fiber)}g.`);
  if (!notes.length) {
    const k = { protein: n.protein * 4, carbs: n.carbs * 4, fat: n.fat * 9 }, t = k.protein + k.carbs + k.fat;
    if (!t) return "No calories to speak of.";
    const top = Object.entries(k).sort((a, b) => b[1] - a[1])[0];
    notes.push(`Most of its calories come from ${top[0]} (${Math.round((top[1] / t) * 100)}%).`);
  }
  return notes.slice(0, 2).join(" ");
}
let lastInsight = "";
function setInsight(text) {
  const el = $("#insightTxt"); if (!el || text === lastInsight && el.textContent) return;
  lastInsight = text;
  streamWords(el, text, 45);
  breathe($("#insightSpark"));
}

/* ---------- Side rails ---------- */
function evCard(e) {
  const d = new Date(e.start);
  const mon = d.toLocaleDateString("en-US", { month: "short", timeZone: TZ }).toUpperCase();
  const day = d.toLocaleDateString("en-US", { day: "numeric", timeZone: TZ });
  const when = d.toLocaleDateString("en-US", { weekday: "short", timeZone: TZ }) + " " + fmtTime(d / 1000);
  return `<a class="ev" href="${esc(e.url)}" target="_blank" rel="noopener">
    <div class="pic">${e.photo ? `<img src="${e.photo}" alt="" loading="lazy">` : ""}<span class="date"><small>${mon}</small><b>${day}</b></span></div>
    <div class="txt"><b>${esc(e.title)}</b><small>${esc(e.place)} · ${esc(when)}</small></div></a>`;
}
function renderRails() {
  const places = DATA.eateries.filter((e) => e.kind === "place").map((e) => ({ e, st: status(e) }));
  const open = places.filter((p) => p.st?.open);
  const soon = places.filter((p) => p.st && !p.st.open && p.st.text !== "Closed").slice(0, 5);
  // Best protein per calorie among meals at open places (or everywhere when nothing's open).
  const pool = new Set((open.length ? open : places).map((p) => p.e.id));
  const seenBase = new Set();
  const lean = Object.values(ITEMS).filter((it) => isReal(it) && meal(it) && it.protein >= 15 && pool.has(HOME[it.id]?.eatery.id) && passes(it))
    .sort((a, b) => b.protein / b.calories - a.protein / a.calories)
    .filter((it) => { const k = strip(it.name, ["bread", "egg", "meat"]).toLowerCase(); return !seenBase.has(k) && seenBase.add(k); }).slice(0, 5);
  $("#railL").innerHTML = `<section>
      <h4><span>${open.length ? "Open now" : "Opening next"}</span><span>${open.length || ""}</span></h4>
      ${(open.length ? open : soon).map(({ e, st }) => `<button class="openrow" data-place="${e.id}"><span class="dot ${st.open ? "on" : ""}"></span><b>${esc(e.name)}</b><small>${esc(st.text.replace(/^Open /, ""))}</small></button>`).join("")}
    </section>
    ${lean.length ? `<section><h4><span>Most protein per calorie</span></h4><p class="rnote">${open.length ? "At places open now." : "Across campus."}</p>
      ${lean.map((it) => `<button class="lean" data-item="${it.id}"><b>${esc(it.name)}</b><small>${esc(HOME[it.id].eatery.name)}</small>
        <span class="lean-bar"><span style="--w:${Math.min(100, ((it.protein * 4) / it.calories) * 100 / 0.6).toFixed(0)}%"></span></span>
        <span class="lean-n"><b>${r0(it.protein)}g</b> protein · ${r0(it.calories)} cal</span></button>`).join("")}</section>` : ""}`;
  $("#railR").innerHTML = EVENTS.length ? `<section><h4><span>Food events</span><span>${EVENTS.length}</span></h4><p class="rnote">From Cornell's events calendar.</p>${EVENTS.map(evCard).join("")}</section>` : "";
}
$("#railL").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-place],[data-item]"); if (!b) return;
  $("#q").value = ""; S.q = "";
  if (b.dataset.place) return go("menu", { eatery: +b.dataset.place, tab: 0 });
  const id = +b.dataset.item, it = ITEMS[id];
  lastCal = null;
  S.eatery = HOME[id].eatery.id;
  go("item", { item: id, group: null, from: "menu", servings: startServings(it), removed: new Set(), extras: new Set(), size: 16, milk: it.drink?.milk ?? "None", pumps: 0, whip: false });
});
$("#sparkSlot").outerHTML = sparkSVG("", "spark");
renderRails();
setInterval(renderRails, 60000);

render();
</script>
